org: ${file(./config.yml):aws.org}
service: shui-backend

provider:
  name: aws
  runtime: nodejs20.x
  region: eu-north-1
  httpApi:
    cors: true
  iam:
    role: ${file(./config.yml):aws.role}

plugins:
  - serverless-offline

functions:
  # --------------------AUTH-----------------------
  RegisterUser:
    handler: functions/auth/RegisterUser/index.handler
    events:
      - httpApi:
          path: /api/auth/register
          method: POST
  LoginUser:
    handler: functions/auth/LoginUser/index.handler
    events:
      - httpApi:
          path: /api/auth/login
          method: POST
    # ------------------MESSAGES---------------------
  GetMessages:
    handler: functions/messages/GetMessages/index.handler
    events:
      - httpApi:
          path: /api/messages/{type} #ALL or MINE
          method: GET
  # GetMessagesByUser:
  #   handler: functions/messages/GetMessagesByUser/index.handler
  #   events:
  #     - httpApi:
  #         path: /api/messages/{username}
  #         method: GET
  PostMessage:
    handler: functions/messages/PostMessage/index.handler
    events:
      - httpApi:
          path: /api/messages
          method: POST
  UpdateMessageById:
    handler: functions/messages/UpdateMessageById/index.handler
    events:
      - httpApi:
          path: /api/messages/{id}
          method: PUT
  DeleteMessageById:
    handler: functions/messages/DeleteMessageById/index.handler
    events:
      - httpApi:
          path: /api/messages/{id}
          method: DELETE

resources:
  Resources:
    ShuiTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: shui-table
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: PK
            AttributeType: S
          - AttributeName: SK
            AttributeType: S
          - AttributeName: GSI1PK
            AttributeType: S
          - AttributeName: GSI1SK
            AttributeType: S
          - AttributeName: GSI2PK
            AttributeType: S
          - AttributeName: GSI2SK
            AttributeType: S
        KeySchema:
          - AttributeName: PK
            KeyType: HASH
          - AttributeName: SK
            KeyType: RANGE
        GlobalSecondaryIndexes:
          - IndexName: GSI1
            KeySchema:
              - AttributeName: GSI1PK
                KeyType: HASH
              - AttributeName: GSI1SK
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
          - IndexName: GSI2
            KeySchema:
              - AttributeName: GSI2PK
                KeyType: HASH
              - AttributeName: GSI2SK
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
